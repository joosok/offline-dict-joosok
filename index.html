<!DOCTYPE html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1018">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>离线词典</title>
<style>
/* ---------- 主题 ---------- */
:root[data-theme="ink"]{--bg:#0d1018;--card:#161a23;--line:#242a38;--fg:#e9ecf2;--muted:#8b93a6;--accent:#5b8cff;--accent2:#8b5cf6;--glow1:rgba(91,140,255,.16);--glow2:rgba(139,92,246,.13);--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme="paper"]{--bg:#f7f3ec;--card:#fffdf9;--line:#e6ded2;--fg:#2b2620;--muted:#837a6c;--accent:#b4673a;--accent2:#2f6f6b;--glow1:rgba(180,103,58,.12);--glow2:rgba(47,111,107,.10);--shadow:0 8px 24px rgba(120,96,72,.14)}
:root[data-theme="forest"]{--bg:#0e1a15;--card:#15241e;--line:#233a30;--fg:#e6f0ea;--muted:#8ca79a;--accent:#4ea87a;--accent2:#d9a441;--glow1:rgba(78,168,122,.16);--glow2:rgba(217,164,65,.10);--shadow:0 10px 30px rgba(0,0,0,.32)}
:root[data-theme="sakura"]{--bg:#fdf3f5;--card:#ffffff;--line:#f2dae1;--fg:#40232c;--muted:#9b7c86;--accent:#d95f8a;--accent2:#6f7fd6;--glow1:rgba(217,95,138,.14);--glow2:rgba(111,127,214,.10);--shadow:0 8px 24px rgba(190,120,140,.16)}
:root[data-theme="oled"]{--bg:#000000;--card:#0a0a0c;--line:#1b1b1f;--fg:#e6e6ea;--muted:#7d7d86;--accent:#4ea1ff;--accent2:#b388ff;--glow1:rgba(78,161,255,.10);--glow2:rgba(179,136,255,.08);--shadow:0 10px 30px rgba(0,0,0,.6)}
:root[data-theme="morandi"]{--bg:#eceae6;--card:#f7f6f3;--line:#dad6d0;--fg:#3a3936;--muted:#8b8781;--accent:#8a9a8f;--accent2:#a08a8f;--glow1:rgba(138,154,143,.13);--glow2:rgba(160,138,143,.11);--shadow:0 8px 24px rgba(120,116,110,.12)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);min-height:100vh;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:-25% -15% auto -15%;height:80vh;background:radial-gradient(600px 420px at 18% 20%,var(--glow1),transparent 68%),radial-gradient(520px 380px at 82% 8%,var(--glow2),transparent 70%);pointer-events:none;z-index:0}
header{position:relative;z-index:20;display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
header h1{font-size:16px;margin:0;flex:1;letter-spacing:.3px;font-weight:600}
header h1 .star{color:var(--accent);margin-right:6px}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;min-height:40px;font-size:14px;box-shadow:var(--shadow)}
.hbtn:active{transform:scale(.96)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.themes{position:absolute;right:14px;top:60px;z-index:25;display:none;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 28px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.themes.open{display:flex}
.swatch{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--sw);cursor:pointer}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
main{position:relative;z-index:1;padding:4px 16px calc(128px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.status{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 4px 0}
.hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;min-height:36px}
.browse{margin-top:20px}
.browse .bhd{font-size:12px;color:var(--muted);margin:0 2px 9px}
.tagsrow{display:flex;flex-wrap:wrap;gap:8px}
.tagsrow .chip{padding:8px 13px}
.tagsrow .chip .n{font-size:11px;color:var(--muted);margin-left:3px}
.list{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.item:first-child{border-top:0}
.item:active{background:var(--accent-soft,rgba(127,127,127,.12))}
.item .w{font-weight:600;font-size:17px;padding-right:30px}
.item .w .ph{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.item .d{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:30px}
.item .starBtn{position:absolute;right:4px;top:9px;border:0;background:transparent;color:var(--accent);font-size:19px;line-height:1;padding:4px 7px;min-height:0;min-width:32px}
.item .starBtn.off{color:var(--muted);opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow);animation:in .22s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card .word{font-size:24px;font-weight:700;flex:1;word-break:break-word;letter-spacing:.2px}
.card .ph{font-size:14px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.phgap{margin:0 6px;opacity:.55}
.card .defs{margin:12px 0 0;padding:0;list-style:none;-webkit-user-select:text;user-select:text}
.card .defs li{padding:10px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.75;word-break:break-word}
.card .defs li:first-child{border-top:0}
.hintcopy{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.icon{width:42px;height:42px;min-width:42px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px}
.icon.starred{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:10px;min-height:42px}
.msg{color:var(--muted);font-size:14px;text-align:center;padding:34px 10px}
.msg .big{font-size:30px;display:block;margin-bottom:8px;opacity:.55}
.tag{font-size:11px;font-weight:400;padding:1px 7px;border-radius:7px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);vertical-align:middle;margin-left:6px;white-space:nowrap}
.t4{--tc:#4caf7d}.t6{--tc:#2ea8a0}.ti{--tc:#d99a2b}.tt{--tc:#e0763a}.tg{--tc:#9a7cf0}
.tky{--tc:#e06b6b}.tc{--tc:#5b8cff}.te{--tc:#8b93a6}.tl{--tc:#39b6c8}.tb{--tc:#d98bb0}.thf{--tc:#d9b23a}.tox{--tc:#c9a227}
.bmeta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.bitem{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.bitem:nth-of-type(2){border-top:0}
.bw{font-weight:600;font-size:15px}
.bw .ph{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.bd{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.more{font-size:12px;color:var(--muted);padding-top:8px}
.bitem.unknown .bw{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.transbox{margin-top:12px;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:14px}
.transbox .out{font-size:16px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
/* ---------- 底部搜索 dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);will-change:transform}
/* ---------- 首屏骨架 ---------- */
#boot{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px}
#boot .bk{width:min(76vw,420px);height:14px;border-radius:8px;background:var(--line);animation:sh 1.1s ease-in-out infinite}
#boot .bk:nth-child(2){width:min(58vw,320px);animation-delay:.15s}
#boot .bk:nth-child(3){width:min(66vw,360px);animation-delay:.3s}
@keyframes sh{0%,100%{opacity:.35}50%{opacity:.85}}
.dockinner{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 14px;box-shadow:var(--shadow)}
.dockinner .sicon{font-size:15px;opacity:.7}
.dockinner input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:16.5px;font-family:inherit;padding:9px 0;-webkit-appearance:none}
.dockinner input::placeholder{color:var(--muted)}
.dockclear{width:30px;height:30px;min-height:0;border:0;background:transparent;color:var(--muted);font-size:18px;padding:0;border-radius:50%;display:none}
.dockclear.show{display:block}
/* ---------- 生词本 ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;max-height:84vh;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .26s cubic-bezier(.3,.9,.3,1);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);box-shadow:var(--shadow)}
.sheet.show{transform:none}
.sheet .hd{display:flex;align-items:center;padding:15px 16px 6px}
.sheet .hd h2{font-size:16px;margin:0;flex:1}
.sheet .hd button{border:0;background:transparent;color:var(--accent);padding:6px 8px;min-height:0}
.tabs{display:flex;gap:6px;padding:8px 16px 10px}
.tab{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);min-height:40px}
.tab.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:transparent}
.sheet .bd{overflow:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.vitem{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.vitem .t{flex:1;min-width:0}
.vitem .q{font-weight:600}
.vitem .a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.vitem .a:active{color:var(--accent)}
.vitem .spk{opacity:.55;margin-right:3px;font-size:12px}
.vfilter{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 8px}
.vfilter .chip{padding:5px 11px;font-size:12px;min-height:30px}
.vfilter .chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:transparent}
.vitem .del{border:0;background:transparent;color:var(--muted);font-size:22px;padding:0 8px;min-height:0}
.sheet .ft{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.sheet .ft button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:10px;min-height:44px}
.qcard{background:color-mix(in srgb,var(--accent) 7%,var(--bg));border:1px solid var(--line);border-radius:18px;padding:24px 16px;margin:12px 0;text-align:center;cursor:pointer}
.qword{font-size:30px;font-weight:700;word-break:break-word}
.qph{color:var(--muted);font-size:14px;margin-top:4px}
.qdef{margin-top:16px;font-size:15px;line-height:1.7;min-height:46px}
.qdef.hide{color:var(--muted);font-size:13px}
.qidx{font-size:12px;color:var(--muted);margin-bottom:10px}
.qnav{display:flex;gap:10px}
.qnav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:10px;min-height:44px}
.qscopes{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.qscopes .chip{padding:5px 11px;font-size:12px;min-height:30px}
.qscopes .chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:transparent}
.qscopes .chip .n{font-size:11px;color:var(--muted);margin-left:3px}
.qgrade{display:flex;gap:10px;margin-top:2px}
.qgrade button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:11px;min-height:46px;font-size:15px}
.qgrade .no{color:#e06b6b;border-color:color-mix(in srgb,#e06b6b 45%,transparent)}
.qgrade .yes{color:#4caf7d;border-color:color-mix(in srgb,#4caf7d 45%,transparent)}
.qmeta{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.qspk{border:0;background:transparent;color:var(--muted);font-size:15px;padding:3px 7px;min-height:0}
.qsum{text-align:center;padding:10px 0 4px}
.qsum .big{font-size:30px;font-weight:700}
.qsum .sub{font-size:13px;color:var(--muted);margin-top:6px}
.qwlist{font-size:13px;color:var(--muted);margin:12px 0;line-height:1.9;word-break:break-word;text-align:left}
.wt{font-size:10px;color:#e06b6b;background:color-mix(in srgb,#e06b6b 14%,transparent);border-radius:7px;padding:1px 6px;margin-left:6px;vertical-align:middle}
/* ---------- 例句 / 星标 / 可点标签 ---------- */
.exs{margin-top:14px}
.exshd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:0 2px 4px}
.exs .ex{padding:9px 0;border-top:1px solid var(--line)}
.exs .ex:first-of-type{border-top:0}
.ex-en{font-size:15px;line-height:1.7;-webkit-user-select:text;user-select:text}
.ex-zh{font-size:13px;color:var(--muted);margin-top:2px}
.exload{font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.mark{color:var(--accent);font-size:12px;margin-left:5px}
.tagbtn{border:0;background:transparent;cursor:pointer;-webkit-appearance:none;padding:1px 7px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(0,0,0,.84);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="boot"><div class="bk"></div><div class="bk"></div><div class="bk"></div><span>正在加载词库…</span></div>
<header>
  <button class="hbtn" id="btnBackTop" aria-label="返回上级" style="display:none">←</button>
  <h1><span class="star">✦</span>离线词典</h1>
  <button class="hbtn" id="btnTheme" aria-label="切换主题">🎨</button>
  <button class="hbtn" id="btnVocab">生词本 <span class="badge" id="vocabCount" style="display:none">0</span></button>
  <div class="themes" id="themes">
    <button class="swatch" data-t="ink" style="--sw:#5b8cff" title="墨蓝"></button>
    <button class="swatch" data-t="paper" style="--sw:#c2703f" title="米纸"></button>
    <button class="swatch" data-t="forest" style="--sw:#4ea87a" title="森林"></button>
    <button class="swatch" data-t="sakura" style="--sw:#d95f8a" title="樱粉"></button>
    <button class="swatch" data-t="oled" style="--sw:#4ea1ff" title="纯黑"></button>
    <button class="swatch" data-t="morandi" style="--sw:#8a9a8f" title="莫兰迪"></button>
  </div>
</header>

<main>
  <div class="status"><span id="tip">完全离线 · 词库在本地</span><span id="count"></span></div>
  <div class="hist" id="hist"></div>
  <section id="out"></section>
</main>

<div class="dock">
  <div class="dockinner">
    <span class="sicon">🔍</span>
    <input id="q" type="search" placeholder="输入单词或整句…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="dockclear" id="btnClearQ" aria-label="清空">×</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="hd"><h2>生词本</h2><button id="btnClose">关闭</button></div>
  <div class="tabs">
    <button class="tab on" data-tab="list" id="tabList">列表</button>
    <button class="tab" data-tab="quiz" id="tabQuiz">复习</button>
  </div>
  <div class="bd" id="vocabBody"></div>
  <div class="ft">
    <button id="btnExport">导出文本</button>
    <button id="btnBackup">备份文件</button>
    <button id="btnRestore">恢复备份</button>
    <button id="btnClear" style="color:var(--muted)">清空</button>
  </div>
  <input type="file" id="fileRestore" accept=".json,application/json" style="display:none">
</div>
<div class="toast" id="toast"></div>

<script>
setTimeout(function(){
  var b=document.getElementById('boot'); if(!b || b.querySelector('button')) return;
  var t=document.createElement('button');
  t.textContent='加载较慢，点此重试';
  t.style.cssText='margin-top:6px;padding:10px 18px;border-radius:12px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit';
  t.onclick=function(){ location.reload(); };
  b.appendChild(t);
}, 8000);
</script>
<script src="oxford.js"></script><script src="dict.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var el = { q:$('#q'), out:$('#out'), count:$('#count'), tip:$('#tip'), hist:$('#hist'),
             sheet:$('#sheet'), backdrop:$('#backdrop'), vocabBody:$('#vocabBody'), badge:$('#vocabCount'),
             toast:$('#toast'), tabList:$('#tabList'), tabQuiz:$('#tabQuiz'), themes:$('#themes'),
             clearQ:$('#btnClearQ') };
  var KEY_VOCAB = 'offline_dict_vocab_v1', KEY_HIST = 'offline_dict_hist_v1', KEY_THEME = 'offline_dict_theme_v1';
  var CN = /[\u4e00-\u9fa5]/;
  var TAG = {'四级':'t4','六级':'t6','雅思':'ti','托福':'tt','GRE':'tg','考研':'tky','常用':'tc','扩展':'te','物流':'tl','基础':'tb','高频':'thf','牛津':'tox'};
  if(typeof DICT === 'undefined' || !DICT || !DICT.length){
    var bkEl = document.getElementById('boot');
    if(bkEl) bkEl.innerHTML = '<span>词库加载失败</span><button onclick="location.reload()" style="margin-top:8px;padding:10px 18px;border-radius:12px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit">重新加载</button>';
    return;
  }
  var words = [], normed = [], map = {};
  function addWord(w){
    var nw = norm(w[0]);
    var i = words.length;
    words.push(w); normed.push(nw);
    if(!(nw in map)) map[nw] = i;
  }
  for(var i=0;i<DICT.length;i++) addWord(DICT[i]);
  function exactIdx(q){ var k = norm(q); return (k in map) ? map[k] : null; }

  function norm(s){ return String(s).toLowerCase().replace(/[\s\-_'’.·]/g, ''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tag(w){
    if(!w[3]) return '';
    return '<span class="tag ' + (TAG[w[3]] || 'te') + '">' + esc(w[3]) + '</span>';
  }
  function tagBtn(w){                               // 详情页：标签可点，跳到该来源词表
    if(!w[3]) return '';
    return '<button class="tag tagbtn ' + (TAG[w[3]] || 'te') + '" data-tag="' + esc(w[3]) + '">' + esc(w[3]) + '</button>';
  }
  function oxBadge(w){                               // 牛津高阶词表标记
    if(!isOx(w[0]) || w[3] === '牛津') return '';
    return '<button class="tag tagbtn tox" data-tag="牛津">牛津</button>';
  }

  function ipa(x){ return '/' + String(x).replace(/^[\/\[]+|[\/\]]+$/g, '').trim() + '/'; }
  function phPlain(w){                              // 英 /…/ 美 /…/（纯文本）

  /* ---------- 词形归一化搜索 ---------- */
  function stems(q){
    var out = [];
    if(/ies$/.test(q)) out.push(q.slice(0,-3) + 'y');
    if(/es$/.test(q)) out.push(q.slice(0,-2));
    if(/ed$/.test(q)){ out.push(q.slice(0,-2)); out.push(q.slice(0,-1)); }
    if(/ing$/.test(q)){ out.push(q.slice(0,-3)); out.push(q.slice(0,-3) + 'e'); }
    if(/s$/.test(q)) out.push(q.slice(0,-1));
    return out;
  }
  function findIdx(q){
    var exact = [], start = [], contain = [];
    for(var i=0;i<normed.length;i++){
      var w = normed[i];
      if(w === q) exact.push(i);
      else if(w.indexOf(q) === 0){ if(start.length < 40) start.push(i); }
      else if(w.indexOf(q) > 0){ if(contain.length < 40) contain.push(i); }
    }
    return exact.concat(start, contain).slice(0, 40);
  }
  function search(kw){
    var q = norm(kw);
    if(!q) return [];
    var r = findIdx(q);
    if(!r.length && /^[a-z'\-]+$/i.test(kw.trim())){
      var c = stems(q);
      for(var i=0;i<c.length;i++){
        var t = findIdx(c[i]);
        if(t.length) return t;
      }
    }
    return r;
  }

  /* ---------- 搜索历史 ---------- */

  /* ---------- 结果渲染 ---------- */

  function isSentence(kw){ return /[\s,.;:!?，。；！？]/.test(String(kw).trim()); }

  function sentenceHTML(kw){
    var toks = String(kw).toLowerCase().match(/[a-z][a-z'\-]*/g) || [];
    var seen = {}, list = [];
    toks.forEach(function(t){ if(!seen[t]){ seen[t] = 1; list.push(t); } });
    if(list.length < 2) return '';
    var shown = list.slice(0, 40), miss = 0, rows = '';
    shown.forEach(function(t){
      var i = exactIdx(t);
      if(i === null){
        var st = stems(t);
        for(var k=0;k<st.length;k++){ var j = exactIdx(st[k]); if(j !== null){ i = j; break; } }
      }

  function doSearch(kw, remember, back){
    kw = String(kw);
    if(!kw.trim()){ emptyState(); return; }
    if(remember) pushHist(kw);
    renderHist();
    if(isSentence(kw) && exactIdx(kw) === null){
      var sh = sentenceHTML(kw);
      if(sh){ backCtx = back || { type:'home' }; el.out.innerHTML = sh; bindSentence(kw); resetScroll(); return; }
    }
    var idx = search(kw);
    if(!idx.length){
      backCtx = back || { type:'home' };

        '<div class="tools"><button id="btnOnline">联网翻译这个词/句</button></div></div>';

  function goBack(){

  var VSET = null;

  function inVocab(word){ return !!vocabSet()[norm(word)]; }
  function renderWord(i){

    var full = word + (pp ? ' [' + pp + '] ' : ' ') + def;

  /* ---------- 长按复制 ---------- */
  function bindLongPress(node, text){
    if(!node) return;
    var timer = null;
    function clear(){ if(timer){ clearTimeout(timer); timer = null; } }
    node.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      clear();
      timer = setTimeout(function(){ copy(text); }, 550);
    });
    node.addEventListener('pointermove', clear);
    node.addEventListener('pointerup', clear);
    node.addEventListener('pointercancel', clear);
    node.addEventListener('contextmenu', function(e){ e.preventDefault(); clear(); copy(text); });
  }
  function copy(text){
    function done(){ flash('已复制：' + (text.length > 20 ? text.slice(0, 18) + '…' : text)); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ flash('复制失败，请手动选中'); }
      document.body.removeChild(ta);
    }
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = CN.test(text) ? 'zh-CN' : 'en-US'; u.rate = 0.92;
    try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
  }

  /* ---------- 例句分片（首次看词条时才加载，之后走缓存） ---------- */
  var exMap = null, exState = 0, exQueue = [];
  function loadEx(cb){
    if(exState === 2){ cb(exMap); return; }
    if(exState === 3){ cb(null); return; }
    exQueue.push(cb);
    if(exState === 1) return;
    exState = 1;
    var sc = document.createElement('script');
    sc.src = 'ex.js';
    sc.onload = function(){
      exMap = window.__EX__ || {}; window.__EX__ = null; exState = 2;
      var q = exQueue; exQueue = [];
      q.forEach(function(f){ try{ f(exMap); }catch(e){} });
    };
    sc.onerror = function(){
      window.__EX__ = null; exState = 3;
      var q = exQueue; exQueue = [];
      q.forEach(function(f){ try{ f(null); }catch(e){} });
    };
    document.body.appendChild(sc);
  }

  /* ---------- 在线翻译（可选） ---------- */
  function onlineTranslate(text){
    if(!navigator.onLine){ el.tip.textContent = '当前离线，联网后才能翻译整句'; flash('当前离线'); return; }
    var pair = CN.test(text) ? 'zh-CN|en' : 'en|zh-CN';
    var panel = document.createElement('div');
    panel.className = 'transbox';
    panel.innerHTML = '<div class="status"><span>在线翻译</span><span>需联网</span></div><div class="out">正在翻译…</div>';
    el.out.insertBefore(panel, el.out.firstChild);
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair)
      .then(function(r){ return r.json(); })
      .then(function(j){
        var t = j && j.responseData && j.responseData.translatedText;
        if(!t) throw new Error('没有拿到译文');
        var ta = document.createElement('textarea'); ta.innerHTML = t;
        panel.querySelector('.out').textContent = ta.value;
      })
      .catch(function(e){
        panel.querySelector('.out').textContent = '翻译失败：' + (e.message || '网络错误') + '（离线时只能查词）';
      });
  }

  /* ---------- 生词本 ---------- */
  function loadVocab(){ return load(KEY_VOCAB, []); }

  function renderBadge(){

  function addVocab(w, d, p){

    l.unshift({ q:w, a:d, p:p || '' }); saveVocab(l.slice(0, 800));
  }
  function removeVocab(w){ saveVocab(loadVocab().filter(function(x){ return x.q !== w; })); renderTab(); }

  var sheetTab = 'list', vocabFilter = '';
  function wordTag(q){ var i = exactIdx(q); return i === null ? '' : (words[i][3] || ''); }
  function renderTab(){
    if(sheetTab === 'quiz'){ renderQuiz(); return; }
    var l = loadVocab();
    el.tabList.classList.add('on'); el.tabQuiz.classList.remove('on');
    if(!l.length){
      vocabFilter = '';
      el.vocabBody.innerHTML = '<div class="msg"><span class="big">🗂️</span>还没有收藏的词<br>查词后点右上角 ☆ 收藏</div>';
      return;
    }
    var ox = 0, wc = 0;
    l.forEach(function(v){
      if(isOx(v.q)) ox++;
      if(wrongCount(v.q)) wc++;
    });
    if(vocabFilter === '牛津' && !ox) vocabFilter = '';
    if(vocabFilter === '错词' && !wc) vocabFilter = '';
    var items = vocabFilter
      ? l.filter(function(v){
          if(vocabFilter === '牛津') return isOx(v.q);
          if(vocabFilter === '错词') return wrongCount(v.q) > 0;
          return wordTag(v.q) === vocabFilter;
        })
      : l;
    var h = '<div class="vfilter"><button class="chip' + (vocabFilter ? '' : ' on') +
            '" data-f="">全部 ' + l.length + '</button>' +
            (wc ? '<button class="chip' + (vocabFilter === '错词' ? ' on' : '') +
             '" data-f="错词">错词 ' + wc + '</button>' : '') +
            (ox ? '<button class="chip' + (vocabFilter === '牛津' ? ' on' : '') +
             '" data-f="牛津">牛津 ' + ox + '</button>' : '') + '</div><div id="vlist"></div>';
    el.vocabBody.innerHTML = h;
    var box = document.getElementById('vlist');
    items.forEach(function(v){
      var row = document.createElement('div'); row.className = 'vitem';
      var t = document.createElement('div'); t.className = 't';
      var q = document.createElement('div'); q.className = 'q'; q.textContent = v.q;
      var tg = wordTag(v.q);
      if(tg && tg !== '牛津'){
        var bg = document.createElement('button');
        bg.className = 'tag tagbtn ' + (TAG[tg] || 'te');
        bg.setAttribute('data-tag', tg); bg.textContent = tg;
        bg.onclick = function(e){ e.stopPropagation(); closeSheet(); browseTag(tg); };
        q.appendChild(bg);
      }
      if(isOx(v.q)){
        var og = document.createElement('button');
        og.className = 'tag tagbtn tox'; og.setAttribute('data-tag', '牛津'); og.textContent = '牛津';
        og.onclick = function(e){ e.stopPropagation(); closeSheet(); browseTag('牛津'); };
        q.appendChild(og);
      }
      var wcn = wrongCount(v.q);
      if(wcn){
        var wb = document.createElement('span'); wb.className = 'wt'; wb.textContent = '错' + wcn;
        q.appendChild(wb);
      }
      var a = document.createElement('div'); a.className = 'a';
      var spk = document.createElement('span'); spk.className = 'spk'; spk.textContent = '🔊';
      a.appendChild(spk); a.appendChild(document.createTextNode(v.a || ''));
      a.title = '点释义朗读';
      a.onclick = function(e){ e.stopPropagation(); speak(v.q); };
      t.appendChild(q); t.appendChild(a);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.onclick = function(e){ e.stopPropagation(); removeVocab(v.q); };
      row.appendChild(t); row.appendChild(del);
      row.onclick = function(){ closeSheet(); el.q.value = v.q; syncClear(); doSearch(v.q, false); };
      box.appendChild(row);
    });
    Array.prototype.forEach.call(el.vocabBody.querySelectorAll('.vfilter .chip'), function(b){
      b.onclick = function(){ vocabFilter = b.getAttribute('data-f') || ''; renderTab(); };
    });
  }

  /* ---------- 自测 / 复习 ---------- */
  var KEY_STATS = 'offline_dict_stats_v1', STATS = null;
  function loadStats(){ return load(KEY_STATS, {}); }
  function saveStats(s){ save(KEY_STATS, s); STATS = null; }
  function statOf(w){ if(!STATS) STATS = loadStats(); return STATS[norm(w)]; }
  function wrongCount(w){ var o = statOf(w); return o ? (o.w || 0) : 0; }
  function markKnown(w){
    var s = loadStats(), k = norm(w);
    if(s[k]){ delete s[k]; saveStats(s); }
  }
  function markWrong(w){
    var s = loadStats(), k = norm(w), o = s[k] || { w:0 };
    o.w = (o.w || 0) + 1; o.t = Date.now();
    s[k] = o; saveStats(s);
  }
  var quiz = { scope:'全部', queue:[], i:0, reveal:false, ok:0, no:0, wrong:[], done:false };
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function quizPool(){
    var l = loadVocab();
    if(quiz.scope === '错词') return l.filter(function(v){ return wrongCount(v.q) > 0; });
    if(quiz.scope === '牛津') return l.filter(function(v){ return isOx(v.q); });
    if(quiz.scope !== '全部') return l.filter(function(v){ return wordTag(v.q) === quiz.scope; });
    return l;
  }
  function scopeChips(){
    var l = loadVocab(), c = { '全部': l.length, '错词': 0, '牛津': 0 }, h = '';
    l.forEach(function(v){
      if(wrongCount(v.q)) c['错词']++;
      if(isOx(v.q)) c['牛津']++;
      var t = wordTag(v.q);
      if(t === '四级' || t === '六级' || t === '考研') c[t] = (c[t] || 0) + 1;
    });
    ['全部','错词','牛津','四级','六级','考研'].forEach(function(k){
      if(!c[k]) return;
      h += '<button class="chip' + (quiz.scope === k ? ' on' : '') + '" data-s="' + k + '">' + k +
           '<span class="n">' + c[k] + '</span></button>';
    });
    return '<div class="qscopes">' + h + '</div>';
  }
  function startQuiz(scope){
    if(scope !== undefined) quiz.scope = scope;
    quiz.queue = shuffle(quizPool().slice()).slice(0, 30);
    quiz.i = 0; quiz.reveal = false; quiz.ok = 0; quiz.no = 0; quiz.wrong = []; quiz.done = false;
  }
  function bindScopeChips(){
    Array.prototype.forEach.call(el.vocabBody.querySelectorAll('.qscopes .chip'), function(b){
      b.onclick = function(){ startQuiz(b.getAttribute('data-s')); renderQuiz(); };
    });
  }
  function renderQuiz(){
    el.tabQuiz.classList.add('on'); el.tabList.classList.remove('on');
    if(!loadVocab().length){
      quiz.queue = [];
      el.vocabBody.innerHTML = '<div class="msg"><span class="big">🗂️</span>生词本是空的<br>先收藏几个词再来自测</div>';
      return;
    }
    if(!quiz.queue.length && !quiz.done) startQuiz();
    var chips = scopeChips();
    if(!quiz.queue.length){
      el.vocabBody.innerHTML = chips + '<div class="msg">这个范围里还没有词<br>换个范围试试</div>';
      bindScopeChips(); return;
    }
    if(quiz.done){
      var wl = quiz.wrong.length
        ? '<div class="qwlist">本轮不认识：' + quiz.wrong.map(function(w){ return esc(w); }).join('、') + '</div>'
        : '<div class="qwlist">全部认识，很棒。</div>';
      el.vocabBody.innerHTML = chips +
        '<div class="qsum"><div class="big">' + quiz.ok + ' / ' + (quiz.ok + quiz.no) + '</div>' +
        '<div class="sub">本轮认识 ' + quiz.ok + ' 词 · 不认识 ' + quiz.no + ' 词</div>' + wl +
        '<div class="qgrade"><button class="no" id="qAgainWrong">再测错词</button>' +
        '<button class="yes" id="qAgain">再来一轮</button></div></div>';
      bindScopeChips();
      $('#qAgainWrong').onclick = function(){ startQuiz('错词'); renderQuiz(); };
      $('#qAgain').onclick = function(){ startQuiz(quiz.scope); renderQuiz(); };
      return;
    }
    var v = quiz.queue[quiz.i];
    el.vocabBody.innerHTML = chips +
      '<div class="qcard" id="qcard"><div class="qidx">第 ' + (quiz.i + 1) + ' / ' + quiz.queue.length + ' 张</div>' +
      '<div class="qword">' + esc(v.q) + '</div>' +
      (v.p ? '<div class="qph">' + esc(v.p) + '<button class="qspk" id="qSpeak">🔊</button></div>' : '') +
      '<div class="qdef' + (quiz.reveal ? '' : ' hide') + '">' +
      (quiz.reveal ? esc(v.a || '（没有释义）') : '点击卡片查看释义') + '</div></div>' +
      (quiz.reveal
        ? '<div class="qgrade"><button class="no" id="qNo">不认识</button><button class="yes" id="qYes">认识</button></div>'
        : '<div class="qnav"><button id="qToggle">显示释义</button></div>') +
      '<div class="qmeta">认识 ' + quiz.ok + ' · 不认识 ' + quiz.no + '</div>';
    bindScopeChips();
    $('#qcard').onclick = function(){ quiz.reveal = !quiz.reveal; renderQuiz(); };
    var tg = $('#qToggle'); if(tg) tg.onclick = function(e){ e.stopPropagation(); quiz.reveal = true; renderQuiz(); };
    var sp = $('#qSpeak'); if(sp) sp.onclick = function(e){ e.stopPropagation(); speak(v.q); };
    var yn = $('#qYes'); if(yn) yn.onclick = function(){ quiz.ok++; markKnown(v.q); nextQuiz(); };
    var nn = $('#qNo'); if(nn) nn.onclick = function(){ quiz.no++; quiz.wrong.push(v.q); markWrong(v.q); nextQuiz(); };
  }
  function nextQuiz(){
    quiz.reveal = false; quiz.i++;
    if(quiz.i >= quiz.queue.length) quiz.done = true;
    renderQuiz();
  }
  el.tabList.onclick = function(){ sheetTab = 'list'; renderTab(); };
  el.tabQuiz.onclick = function(){ sheetTab = 'quiz'; quiz.queue = []; quiz.scope = '全部'; startQuiz(); renderTab(); };

  function openSheet(){ renderTab(); el.sheet.classList.add('show'); el.backdrop.classList.add('show'); }
  function closeSheet(){ el.sheet.classList.remove('show'); el.backdrop.classList.remove('show'); }

  /* ---------- 事件 ---------- */
  function syncClear(){ el.clearQ.classList.toggle('show', !!el.q.value); }
  var timer = null, composing = false;
  el.q.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(timer);
    var v = el.q.value;
    if(!v.trim()) return;
    el.q.blur();
    doSearch(v, true);
  });
  el.q.addEventListener('compositionstart', function(){ composing = true; });
  el.q.addEventListener('compositionend', function(){
    composing = false; syncClear();
    clearTimeout(timer);
    var v = el.q.value;
    timer = setTimeout(function(){ doSearch(v, false); }, 120);
  });
  el.q.addEventListener('input', function(){
    syncClear();
    if(composing) return;
    clearTimeout(timer);
    var v = el.q.value;
    if(!v.trim()){ emptyState(); return; }
    timer = setTimeout(function(){ doSearch(v, false); }, 180);
  });
  el.q.addEventListener('search', function(){ if(el.q.value.trim()) doSearch(el.q.value, true); });
  el.clearQ.onclick = function(){ el.q.value = ''; syncClear(); emptyState(); el.q.focus(); };
  $('#btnVocab').onclick = openSheet;
  $('#btnClose').onclick = closeSheet;
  el.backdrop.onclick = closeSheet;
  $('#btnExport').onclick = function(){
    var l = loadVocab();
    if(!l.length){ flash('生词本为空'); return; }
    var txt = l.map(function(v){ return v.q + '\t' + (v.a || ''); }).join('\n');
    var blob = new Blob([txt], { type:'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = '生词本.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  $('#btnClear').onclick = function(){
    if(!loadVocab().length) return;
    if(confirm('确定清空生词本？')){ saveVocab([]); renderTab(); }
  };

  /* ---------- 异常兜底：出错时避免整页黑屏 ---------- */
  function showFault(msg){
    try{
      el.out.innerHTML = '<div class="card"><div class="msg"><span class="big">⚠️</span>' +
        '页面出了点小问题<br><span style="font-size:12px">' + esc(String(msg || '').slice(0, 140)) + '</span></div>' +
        '<div class="tools"><button id="btnRecover">返回首页</button></div></div>';
      var b = $('#btnRecover');
      if(b) b.onclick = function(){ el.q.value = ''; syncClear(); emptyState(); };
    }catch(e){}
  }
  window.addEventListener('error', function(ev){ showFault(ev && ev.message); });
  window.addEventListener('unhandledrejection', function(ev){ showFault('异步错误'); });

  /* ---------- 初始化 ---------- */
  el.count.textContent = '词库加载中 · v23';
  renderBadge();
  emptyState();
  syncClear();
  if(!navigator.onLine) el.tip.textContent = '当前离线 · 查词照常可用';

  var bootEl = document.getElementById('boot'); if(bootEl) bootEl.remove();
  var btk = document.getElementById('btnBackTop'); if(btk) btk.onclick = goBack;
  setTimeout(function(){ var b = document.getElementById('boot'); if(b) b.remove(); }, 6000);

  /* ---------- 禁止双指/双击缩放 ---------- */
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener('touchmove', function(e){ if(e.touches.length > 1) e.preventDefault(); }, { passive:false });

  /* ---------- 键盘弹出时把底部输入栏顶到键盘上方，避免掉落 ---------- */
  if(window.visualViewport){
    var dockEl = document.querySelector('.dock');
    var pinDock = function(){
      var vv = window.visualViewport;
      var gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      dockEl.style.transform = gap ? 'translateY(' + gap + 'px)' : '';
    };
    window.visualViewport.addEventListener('resize', pinDock);
    window.visualViewport.addEventListener('scroll', pinDock);
  }

  /* ---------- 词库分段补齐：先出核心词，其余后台加载 ---------- */
  var REST = ["dict-2.js", "dict-3.js", "dict-4.js", "dict-5.js", "dict-6.js", "dict-7.js", "dict-8.js"], restStarted = false;
  function loadRest(){
    if(restStarted) return;
    restStarted = true;
    var seq = Promise.resolve();
    REST.forEach(function(src){
      seq = seq.then(function(){
        return new Promise(function(res){
          var sc = document.createElement('script');
          sc.src = src;
          sc.onload = function(){
            var arr = window.__REST__ || [];
            window.__REST__ = null;
            for(var k = 0; k < arr.length; k++) addWord(arr[k]);
            el.count.textContent = '共 ' + words.length + ' 词 · v23';
            res();
          };
          sc.onerror = function(){ res(); };
          document.body.appendChild(sc);
        });
      });
    });
    seq.then(function(){
      el.count.textContent = '共 ' + words.length + ' 词 · v23';
      var tr = document.getElementById('tagRow');
      if(tr && !el.q.value.trim() && backCtx.type === 'home'){
        tr.innerHTML = tagRow();
        bindTagRow();
      }
    });
  }
  setTimeout(loadRest, 300);
  window.addEventListener('online', function(){ el.tip.textContent = '已联网 · 可翻译整句'; });
  window.addEventListener('offline', function(){ el.tip.textContent = '当前离线 · 查词照常可用'; });
})();
</script>
</body>
